<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licenciatura 4° Medio</title>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #162038 0%, #090d16 100%);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #escenario {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .oculto { opacity: 0; transform: scale(0.94); }
    .visible { opacity: 1; transform: scale(1); }
    .portada { text-align: center; }
    .portada h1 { font-size: 4.5vw; text-transform: uppercase; letter-spacing: 3px; }
    .portada h3 { color: #eab308; font-size: 2.2vw; margin-top: 12px; font-weight: 400; }
    .individual { text-align: center; }
    .individual h2 { font-size: 2.8vw; margin-bottom: 4px; }
    .individual p { color: #eab308; font-size: 1.5vw; margin-bottom: 18px; font-weight: 500; }
    .individual img {
      height: 68vh; aspect-ratio: 3/4; object-fit: cover; object-position: center top;
      border-radius: 18px; border: 4px solid #eab308; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .titulo-grupo { color: #eab308; font-size: 2vw; margin-bottom: 2.5vh; text-transform: uppercase; letter-spacing: 2px; }
    .mosaico { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.4vw; width: 88vw; max-width: 1600px; }
    .tarjeta {
      background: rgba(255,255,255,0.06); padding: 10px; border-radius: 12px;
      border: 1px solid rgba(234,179,8,0.4); text-align: center;
      opacity: 0; transform: translateY(25px); animation: subir 0.6s ease forwards;
    }
    .tarjeta img { width: 100%; height: 29vh; object-fit: cover; object-position: center top; border-radius: 8px; }
    .tarjeta span { display: block; margin-top: 8px; font-size: 1vw; font-weight: 600; }
    @keyframes subir { to { opacity: 1; transform: translateY(0); } }
    .controles { display: none; }
  </style>
</head>
<body>
  <div id="escenario" class="visible"></div>
  <div class="controles">
    <button id="btnPrev">◀ Anterior</button>
    <button id="btnAuto">Auto: OFF</button>
    <button id="btnFull">⛶ Pantalla Completa</button>
    <button id="btnNext">Siguiente ▶</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
