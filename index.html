<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licenciatura 4° Medio - Presentación</title>

  <!-- Estilos de Reveal.js (Enlaces completos) -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    :root {
      --dorado: #eab308;
      --fondo: #090d16;
    }

    .reveal {
      background: radial-gradient(circle at center, #162038 0%, var(--fondo) 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* Diapositiva de Portada */
    .portada h1 {
      font-size: 3.2em;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .portada h3 {
      color: var(--dorado);
      font-size: 1.6em;
      margin-top: 15px;
      font-weight: 400;
    }

    /* Vista Individual */
    .ficha-individual {
      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ficha-individual img {
      height: 600px;
      width: 460px;
      object-fit: cover;
      object-position: center top; /* Evita cortar cabezas o birretes */
      border-radius: 18px;
      border: 4px solid var(--dorado);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
      margin: 0 0 25px 0 !important;
    }
    .ficha-individual h2 {
      font-size: 2.3em;
      margin: 0;
      color: #ffffff;
      text-transform: none;
    }
    .ficha-individual .subtitulo {
      font-size: 1.15em;
      color: #cbd5e1;
      margin-top: 8px;
    }

    /* Vista Grupal (10 Alumnos: 2 filas x 5 columnas ajustadas a 1080p) */
    .titulo-grupo {
      font-size: 1.4em !important;
      color: var(--dorado) !important;
      margin-bottom: 20px !important;
      text-transform: uppercase !important;
      letter-spacing: 2px;
    }
    .mosaico-10 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      width: 88%;
      margin: 0 auto;
    }
    .item-grupo {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(234, 179, 8, 0.35);
    }
    .item-grupo img {
      width: 100%;
      height: 310px;
      object-fit: cover;
      object-position: center top; /* Encuadra el rostro en la cuadrícula */
      border-radius: 10px;
      margin: 0 !important;
    }
    .item-grupo p {
      font-size: 0.68em;
      margin: 8px 0 2px 0;
      color: #f8fafc;
      font-weight: 600;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <div class="reveal">
    <div class="slides" id="contenedor-slides">
      <section class="portada" data-transition="zoom">
        <h1>Licenciatura 4° Medio</h1>
        <h3>Generación 2026</h3>
      </section>
    </div>
  </div>

  <!-- Script de Reveal.js (Enlace completo) -->
  <script src="https://cloudflare.com"></script>
  <script>
    const alumnos = [
      { nombre: "Camila Andrea Soto", curso: "4° Medio A", foto: "fotos/01.jfif" },
      { nombre: "Martín Ignacio Rojas", curso: "4° Medio A", foto: "fotos/02.jfif" },
      { nombre: "Valentina Paz Muñoz", curso: "4° Medio A", foto: "fotos/03.jfif" },
      { nombre: "Benjamín Alonso Díaz", curso: "4° Medio A", foto: "fotos/04.jfif" },
      { nombre: "Sofía Belén Contreras", curso: "4° Medio A", foto: "fotos/05.jfif" },
      { nombre: "Lucas Mateo Silva", curso: "4° Medio A", foto: "fotos/06.jfif" },
      { nombre: "Isidora Antonia Morales", curso: "4° Medio A", foto: "fotos/07.jfif" },
      { nombre: "Vicente Gabriel Torres", curso: "4° Medio A", foto: "fotos/08.jfif" },
      { nombre: "Emilia Josefa Fuentes", curso: "4° Medio A", foto: "fotos/09.jfif" },
      { nombre: "Tomás Eduardo Castro", curso: "4° Medio A", foto: "fotos/10.jfif" }
    ];

    const contenedor = document.getElementById("contenedor-slides");

    for (let i = 0; i < alumnos.length; i += 10) {
      const bloque = alumnos.slice(i, i + 10);
      const numeroGrupo = Math.floor(i / 10) + 1;

      bloque.forEach((alumno) => {
        const slideInd = document.createElement("section");
        slideInd.className = "ficha-individual";
        slideInd.setAttribute("data-transition", "convex");
        slideInd.innerHTML = `
          <img src="${alumno.foto}" alt="${alumno.nombre}">
          <h2>${alumno.nombre}</h2>
          <div class="subtitulo">${alumno.curso}</div>
        `;
        contenedor.appendChild(slideInd);
      });

      const slideGrupo = document.createElement("section");
      slideGrupo.setAttribute("data-transition", "zoom");
      
      const tarjetasHTML = bloque.map((a) => `
        <div class="item-grupo fragment fade-up">
          <img src="${a.foto}" alt="${a.nombre}">
          <p>${a.nombre}</p>
        </div>
      `).join("");

      slideGrupo.innerHTML = `
        <h3 class="titulo-grupo">Generación 2026 • Grupo ${numeroGrupo}</h3>
        <div class="mosaico-10">${tarjetasHTML}</div>
      `;
      contenedor.appendChild(slideGrupo);
    }

    Reveal.initialize({
      width: 1920,
      height: 1080,
      margin: 0.04,
      controls: true,           // Flechas visibles abajo a la derecha
      progress: true,           // Barra de avance abajo
      center: true,
      hash: false,
      transition: 'fade',
      transitionSpeed: 'slow',
      autoSlide: 0              // Cambia 0 por 3500 si quieres que avance solo cada 3.5 seg
    });
  </script>
</body>
</html>
