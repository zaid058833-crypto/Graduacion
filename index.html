<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licenciatura 4° Medio - Presentación</title>

  <!-- Estilos base y tema oscuro de Reveal.js desde CDN -->
  <link rel="stylesheet" href="https://jsdelivr.net">
  <link rel="stylesheet" href="https://jsdelivr.net">
  <link rel="stylesheet" href="https://jsdelivr.net">

  <style>
    :root {
      --dorado: #eab308;
      --fondo: #090d16;
    }

    .reveal {
      background: radial-gradient(circle at center, #162038 0%, var(--fondo) 100%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* Logo superior discreto para pantalla gigante */
    .logo-colegio {
      position: fixed;
      top: 28px;
      left: 36px;
      height: 65px;
      z-index: 10;
      opacity: 0.9;
    }

    /* Diapositiva de Portada */
    .portada h1 {
      font-size: 3.4em;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .portada h3 {
      color: var(--dorado);
      font-size: 1.6em;
      margin-top: 15px;
      font-weight: 400;
    }

    /* Vista Individual (Pantalla Gigante) */
    .ficha-individual {
      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ficha-individual img {
      height: 540px;
      width: 410px;
      object-fit: cover;
      border-radius: 18px;
      border: 4px solid var(--dorado);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
      margin: 0 0 25px 0 !important;
    }
    .ficha-individual h2 {
      font-size: 2.3em;
      margin: 0;
      color: #ffffff;
      text-transform: none;
    }
    .ficha-individual .subtitulo {
      font-size: 1.15em;
      color: #cbd5e1;
      margin-top: 8px;
    }

    /* Vista Grupal (10 Alumnos: 2 filas x 5 columnas) */
    .titulo-grupo {
      font-size: 1.5em !important;
      color: var(--dorado) !important;
      margin-bottom: 30px !important;
      text-transform: uppercase !important;
      letter-spacing: 2px;
    }
    .mosaico-10 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 24px;
      width: 92%;
      margin: 0 auto;
    }
    .item-grupo {
      background: rgba(255, 255, 255, 0.04);
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(234, 179, 8, 0.35);
    }
    .item-grupo img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 10px;
      margin: 0 !important;
    }
    .item-grupo p {
      font-size: 0.72em;
      margin: 10px 0 2px 0;
      color: #f8fafc;
      font-weight: 600;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <!-- Opcional: descomenta la línea de abajo si tienes el logo en PNG -->
  <!-- <img src="fotos/logo-colegio.png" alt="Logo" class="logo-colegio"> -->

  <div class="reveal">
    <div class="slides" id="contenedor-slides">
      <!-- Portada inicial -->
      <section class="portada" data-transition="zoom">
        <h1>Licenciatura 4° Medio</h1>
        <h3>Generación 2026</h3>
      </section>
    </div>
  </div>

  <!-- Scripts de Reveal.js -->
  <script src="https://jsdelivr.net"></script>
  <script>
    // 1. LISTA DE ALUMNOS (Edita aquí los nombres y rutas de fotos)
    const alumnos = [
      { nombre: "Camila Andrea Soto", curso: "4° Medio A", foto: "fotos/01.jfif" },
      { nombre: "Martín Ignacio Rojas", curso: "4° Medio A", foto: "fotos/02.jfif" },
      { nombre: "Valentina Paz Muñoz", curso: "4° Medio A", foto: "fotos/03.jfif" },
      { nombre: "Benjamín Alonso Díaz", curso: "4° Medio A", foto: "fotos/04.jfif" },
      { nombre: "Sofía Belén Contreras", curso: "4° Medio A", foto: "fotos/05.jfif" },
      { nombre: "Lucas Mateo Silva", curso: "4° Medio A", foto: "fotos/06.jfif" },
      { nombre: "Isidora Antonia Morales", curso: "4° Medio A", foto: "fotos/07.jfif" },
      { nombre: "Vicente Gabriel Torres", curso: "4° Medio A", foto: "fotos/08.jfif" },
      { nombre: "Emilia Josefa Fuentes", curso: "4° Medio A", foto: "fotos/09.jfif" },
      { nombre: "Tomás Eduardo Castro", curso: "4° Medio A", foto: "fotos/10.jfif" },
      // Agrega aquí los siguientes alumnos (se agruparán automáticamente de 10 en 10)
    ];

    const contenedor = document.getElementById("contenedor-slides");

    // 2. GENERACIÓN AUTOMÁTICA: 10 individuales -> 1 grupal de 10
    for (let i = 0; i < alumnos.length; i += 10) {
      const bloque = alumnos.slice(i, i + 10);
      const numeroGrupo = Math.floor(i / 10) + 1;

      // Crear diapositivas individuales con transición suave
      bloque.forEach((alumno) => {
        const slideInd = document.createElement("section");
        slideInd.className = "ficha-individual";
        slideInd.setAttribute("data-transition", "convex"); // Efecto 3D sutil entre alumnos
        slideInd.innerHTML = `
          <img src="${alumno.foto}" alt="${alumno.nombre}">
          <h2>${alumno.nombre}</h2>
          <div class="subtitulo">${alumno.curso}</div>
        `;
        contenedor.appendChild(slideInd);
      });

      // Crear diapositiva grupal de los 10 recién presentados
      const slideGrupo = document.createElement("section");
      slideGrupo.setAttribute("data-transition", "zoom"); // Efecto zoom hacia atrás para mostrar el grupo
      
      const tarjetasHTML = bloque.map((a) => `
        <div class="item-grupo fragment fade-up">
          <img src="${a.foto}" alt="${a.nombre}">
          <p>${a.nombre}</p>
        </div>
      `).join("");

      slideGrupo.innerHTML = `
        <h3 class="titulo-grupo">Generación 2026 • Grupo ${numeroGrupo}</h3>
        <div class="mosaico-10">${tarjetasHTML}</div>
      `;
      contenedor.appendChild(slideGrupo);
    }

    // 3. INICIALIZAR REVEAL.JS PARA PANTALLA GIGANTE
    Reveal.initialize({
      width: 1920,              // Resolución Full HD nativa para proyectores/pantallas LED
      height: 1080,
      margin: 0.04,
      controls: false,          // Oculta las flechas en pantalla para que se vea limpio en el evento
      progress: false,          // Oculta la barra inferior
      center: true,
      hash: false,
      transition: 'fade',
      transitionSpeed: 'slow',  // Transiciones elegantes y pausadas
      autoSlide: 0,             // En 0 avanza manual con clicker/teclado. Pon 4000 si quieres automático cada 4 seg.
      loop: false
    });
  </script>
</body>
</html>
